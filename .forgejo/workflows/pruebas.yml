# Comprueba cada push y cada pull request: formato, vet, pruebas y que compila
# para Windows.
#
# Corre en el Forgejo propio y no en GitHub a proposito: el CI no tiene por que
# depender de un servicio de terceros. El repositorio de GitHub sigue siendo la
# cara publica, pero sin Actions.
#
# El job va dentro de la imagen oficial de Go, no en la que trae el label
# `docker` (basada en node y sin Go): el runner no puede levantar
# contenedores dentro del job (docker_host: "-"), asi que el contenedor del job
# TIENE que ser ya el que trae las herramientas. Por eso aqui no se usa
# ./test.sh, que monta un contenedor: eso es para el PC de cada cual, donde el
# objetivo es no instalar Go. Si cambias las comprobaciones, cambialas en los
# dos sitios.
#
# Los volumenes deckman-ci-* son las caches de Go (modulos y build): sin ellas
# cada push descargaba las dependencias y recompilaba la stdlib entera, dos
# veces (linux y windows). El runner solo admite volumenes con ese prefijo
# (`valid_volumes` en su configuracion, que vive fuera de este repositorio).
#
# Las pruebas de integracion no corren aqui: necesitan una Steam Deck de verdad
# con SSH. Se saltan solas al no haber DECKMAN_TEST_HOST.
name: pruebas

on:
  push:
    branches: [main]
  pull_request:

# Dos pushes seguidos dejaban dos jobs corriendo y el primero ya no le
# importaba a nadie.
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: docker
    # El -timeout de Go solo cubre las pruebas; esto cubre el resto del job.
    timeout-minutes: 30
    container:
      image: docker.io/library/golang:1.26.5
      options: >-
        -v deckman-ci-gomod:/go/pkg/mod
        -v deckman-ci-gocache:/root/.cache/go-build
    env:
      # El clon del CI es un git init artificial: sin esto, cada go build/test
      # pierde tiempo sellando metadatos de VCS que no significan nada.
      GOFLAGS: -buildvcs=false
    steps:
      # Se clona a mano en vez de con actions/checkout a proposito: esa accion
      # esta escrita en JavaScript y necesita `node` DENTRO del contenedor del
      # job, que aqui es la imagen de Go y no lo trae (falla con "node:
      # executable file not found"). git si viene en la imagen, asi que sale
      # mas barato clonar que arrastrar un runtime entero solo para eso.
      #
      # Se pide el commit exacto que disparo el job, no la rama: entre el push
      # y el arranque puede haber entrado otro.
      - name: clonar
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          proto="${GITHUB_SERVER_URL%%://*}"
          host="${GITHUB_SERVER_URL#*://}"
          git config --global --add safe.directory '*'
          git init -q .
          git remote add origin "$proto://x-access-token:$TOKEN@$host/$GITHUB_REPOSITORY"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          echo "en $(git rev-parse --short HEAD)"

      # La version de Go vive en go.mod y la imagen se fija aqui y en
      # scripts/contenedor.sh: si se separan, el CI compila con un toolchain
      # distinto al de todos los demas sin que nada lo diga.
      - name: version de go
        run: |
          quiere="$(sed -n 's/^go //p' go.mod)"
          tiene="$(go version | sed 's/.*go\([0-9][0-9.]*\).*/\1/')"
          if [ "$tiene" != "$quiere" ]; then
            echo "la imagen del job trae go $tiene pero go.mod pide $quiere."
            echo "Actualiza la imagen aqui, en publicar.yml y en scripts/contenedor.sh."
            exit 1
          fi

      - name: formato
        run: |
          sin_formatear="$(gofmt -l ./cmd ./internal)"
          if [ -n "$sin_formatear" ]; then
            echo "estos ficheros no pasan por gofmt:"
            echo "$sin_formatear"
            exit 1
          fi

      # -vet=all dentro de go test: el mismo analisis que un `go vet ./...`
      # suelto, pero compartiendo la compilacion en vez de pagarla dos veces.
      - name: vet y pruebas
        run: go test -vet=all ./... -timeout 15m

      # Solo Windows: el build de Linux ya lo hace go test al enlazar las
      # pruebas. El cruce a Windows es lo unico que no valida nadie mas (la
      # rama window_windows.go con go-webview2), y se compila con la receta
      # real de release: antes iba sin flags y un fallo de enlazado por
      # -H windowsgui no se habria visto hasta publicar.
      - name: compilar windows
        run: scripts/compilar.sh windows /dev/null v0.0.0-ci
