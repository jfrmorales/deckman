# Renovate: abre pull requests cuando una dependencia se queda atras.
#
# Por que hace falta algo asi: en agosto de 2026 este repositorio tenia
# golang.org/x/crypto v0.44.0 con CINCO vulnerabilidades que el codigo llamaba
# de verdad (govulncheck las señalaba por fichero y linea), corregidas desde
# v0.52.0. Nadie lo sabia porque nada miraba. La auditoria (auditoria.yml) ahora
# avisa; esto es la otra mitad, la que ademas propone el arreglo.
#
# Dependabot no vale aqui: es de GitHub, y el CI de este proyecto vive en un
# Forgejo propio a proposito. Renovate si habla con Forgejo — con platform
# "gitea", que es lo que espera aunque el servidor sea Forgejo.
#
# Requisitos, una sola vez (ver CONTRIBUTING.md):
#   - un usuario `renovate-bot` en el Forgejo, con acceso de escritura al repo
#   - su token en el secreto RENOVATE_TOKEN de este repositorio
#
# La primera ejecucion abre un PR de configuracion y una incidencia
# "Dependency Dashboard"; hasta que se acepte ese PR no propone nada mas.
name: renovate

on:
  schedule:
    # Lunes a las 5:00. Semanal y no diario: las dependencias de este proyecto
    # son cuatro, y un PR cada mañana solo consigue que se dejen de mirar.
    - cron: '0 5 * * 1'
  # A mano, para no esperar al lunes cuando salta un aviso de seguridad.
  workflow_dispatch:

jobs:
  renovate:
    runs-on: docker
    timeout-minutes: 30
    container:
      image: docker.io/renovate/renovate:latest
    steps:
      - name: revisar dependencias
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_PLATFORM: gitea
          RENOVATE_ENDPOINT: ${{ github.server_url }}/api/v1
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: 'renovate-bot <renovate-bot@007090.xyz>'
          # El fichero de configuracion del repositorio es renovate.json5: se
          # eligio .json5 para poder comentar las reglas. Hay que decirselo,
          # porque el que crea en el PR inicial es .json si no.
          RENOVATE_ONBOARDING_CONFIG_FILE_NAME: renovate.json5
          LOG_LEVEL: info
        run: renovate
