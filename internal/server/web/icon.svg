<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Icono de deckman: una Steam Deck estilizada con la paleta de la interfaz.
       Es a la vez el favicon de la web y el icono del Flatpak. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232936"/>
      <stop offset="1" stop-color="#12151c"/>
    </linearGradient>
    <linearGradient id="pantalla" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d9de0"/>
      <stop offset="1" stop-color="#2f7dc0"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#fondo)"/>

  <!-- cuerpo de la consola -->
  <rect x="24" y="78" width="208" height="100" rx="30" fill="#1a1f29" stroke="#2e3746" stroke-width="6"/>

  <!-- pantalla -->
  <rect x="86" y="94" width="84" height="68" rx="8" fill="url(#pantalla)"/>
  <!-- rombo de la marca en la pantalla -->
  <path d="M128 108 L146 128 L128 148 L110 128 Z" fill="#e4e8f0"/>

  <!-- stick y cruceta izquierdos -->
  <circle cx="56" cy="112" r="13" fill="#2e3746" stroke="#3d4759" stroke-width="4"/>
  <path d="M56 138 v22 M45 149 h22" stroke="#3d4759" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- stick y botones derechos -->
  <circle cx="200" cy="144" r="13" fill="#2e3746" stroke="#3d4759" stroke-width="4"/>
  <circle cx="192" cy="106" r="6" fill="#3d4759"/>
  <circle cx="212" cy="106" r="6" fill="#3d4759"/>
  <circle cx="202" cy="94" r="6" fill="#4d9de0"/>
  <circle cx="202" cy="118" r="6" fill="#3d4759"/>
</svg>
